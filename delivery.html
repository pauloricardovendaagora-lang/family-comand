<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Command — Your Access</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5ef;
      color: #1d2939;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 680px;
      background: white;
      border-radius: 18px;
      padding: 48px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #edf5ef;
      color: #183828;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.1;
      margin-bottom: 18px;
      color: #142033;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #667085;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #f1c76c, #dca842);
      color: #142033;
      text-decoration: none;
      font-weight: 800;
      font-size: 18px;
      padding: 18px 32px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #98a2b3;
    }

    .brand {
      margin-top: 32px;
      font-size: 14px;
      font-weight: bold;
      color: #a77527;
    }
  </style>
</head>

<body>

  <main class="box">

    <div class="icon">✓</div>

    <h1>Your Family Command is Ready</h1>

    <p>
      Thank you for your purchase.
      Your Family Command system is ready to access.
    </p>

    <a class="btn" href="family-command.pdf">
      Download Family Command
    </a>

    <div class="note">
      Your digital product is available immediately.
    </div>

    <div class="brand">
      Family Command — The 15-Minute Family Care System
    </div>

  </main>

</body>
</html>
